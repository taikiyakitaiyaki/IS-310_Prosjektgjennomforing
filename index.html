<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f2ec" />
    <title>Gruppe 11 | IS-310 Prosjektgjennomføring</title>
    <meta
      name="description"
      content="Gruppe 11 i IS-310. Vi går hele veien med en tydelig plan."
    />

    <!-- Sets the theme before anything paints, from the choice ThemeToggle.jsx
         last saved - otherwise the light default would flash before React's
         first render corrected it to a returning visitor's dark preference. -->
    <script>
      try {
        var storedTheme = localStorage.getItem('is310-theme')
        if (storedTheme === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nb_NO" />
    <meta property="og:title" content="Gruppe 11 | Vi går hele veien" />
    <meta
      property="og:description"
      content="Gruppe 11 går hele veien med en tydelig plan."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gruppe 11 | Vi går hele veien" />
    <meta name="twitter:description" content="Gruppe 11 går hele veien med en tydelig plan." />

    <!-- A contour ring for the tab, in the site's accent. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%232a5fe8' stroke-width='2.2'%3E%3Cellipse cx='16' cy='16' rx='13' ry='11'/%3E%3Cellipse cx='15' cy='15' rx='8' ry='6.5'/%3E%3C/g%3E%3Ccircle cx='14' cy='14' r='2.4' fill='%232a5fe8'/%3E%3C/svg%3E"
    />

    <!-- The site's one typeface, fetched before the stylesheet asks for it so
         the titles arrive in it rather than swapping into it. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 4rem 2rem; font-family: system-ui; color: #191b21; background: #ffffff">
        <h1>Gruppe 11 | IS-310 Prosjektgjennomføring</h1>
        <p>
          Denne siden bruker JavaScript til 3D-grafikk og animasjon. Slå på JavaScript for å se den, eller kontakt oss på
          <a href="mailto:gruppe11@is310.no" style="color: #2a5fe8">gruppe11@is310.no</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
