<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" width="100%" height="100%">
  <defs>
    <linearGradient id="ridge-distant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e5a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#142032" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="ridge-mid" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#26364d" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#182333" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f1722" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="ridge-fore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1c2838" />
      <stop offset="100%" stop-color="#080e16" />
    </linearGradient>

    <linearGradient id="ridge-peak-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfe0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#688cb5" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Distant background mountain peaks -->
  <path
    d="M-50,900 L-50,520 L160,390 L390,490 L640,350 L880,470 L1140,360 L1380,450 L1650,370 L1650,900 Z"
    fill="url(#ridge-distant)"
  />

  <!-- Midground main alpine ridges -->
  <path
    d="M-50,900 L-50,580 L120,470 L320,540 L520,390 L720,500 L930,350 L1150,460 L1360,370 L1650,510 L1650,900 Z"
    fill="url(#ridge-mid)"
  />

  <!-- Facet highlight on the main peak -->
  <polygon
    points="930,350 990,405 930,475 880,415"
    fill="url(#ridge-peak-light)"
  />

  <!-- Foreground mountain silhouette -->
  <path
    d="M-50,900 L-50,670 L200,570 L450,640 L660,540 L900,620 L1120,510 L1340,590 L1650,550 L1650,900 Z"
    fill="url(#ridge-fore)"
  />
</svg>
